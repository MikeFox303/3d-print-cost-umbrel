name: Test and build container

on:
  push:
    branches: [main]
    tags: ['v*']
    # Package/docs-only merges must not republish an unchanged runtime tag.
    # Tag pushes are not subject to path filtering.
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

# The app-version image tag is intentionally mutable during development. Keep
# only one workflow active for each event/ref so a superseded main run cannot
# finish later and overwrite that tag with an older commit.
concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from app import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Refuse stale main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch --no-tags origin main --depth=1
          latest_main="$(git rev-parse origin/main)"
          echo "workflow_sha=$GITHUB_SHA"
          echo "latest_main=$latest_main"
          if [ "$GITHUB_SHA" != "$latest_main" ]; then
            echo "Refusing to publish a stale main run."
            exit 1
          fi
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mikefox303/3d-print-cost-umbrel
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Report multi-arch digest
        if: github.event_name != 'pull_request'
        run: echo "Published digest ${{ steps.build.outputs.digest }}"
