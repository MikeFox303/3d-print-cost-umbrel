name: 3D Print Cost
version: "0.14.0-dev.1"
tagline: Fair pre-print quotes and order economics for 3D printing
description: >-
  A local, browser-first calculator and order ledger for custom 3D-printing services, designed around Bambu Lab X2D workflows.


  Calculate a quote before printing from Bambu Studio time and filament usage, import sliced .3mf plate statistics, keep historical cost snapshots, track adaptive equipment payback, and export or restore your local business data.


  Spoolman and Home Assistant integrations are read-only. Spoolman/Bambuddy remain responsible for their own filament accounting. Home Assistant is used only for post-print energy statistics and never changes the saved customer quote.
releaseNotes: >-
  v0.14 adds a safe iPhone/Home Screen standalone shell without turning the app into an offline business-data client. The package now includes a standards-based web app manifest, touch icons and iOS safe-area handling for notch/Dynamic Island and Home-indicator spacing. A same-origin /healthz heartbeat distinguishes a truly offline phone from an unavailable Umbrel/LAN/VPN/Tailscale path and automatically clears the warning after connectivity returns. Dynamic business responses remain no-store, there is no service worker or offline quote/order cache, and Umbrel/SQLite remains the authoritative source. Pricing formulas, persistent /data, and database schema are unchanged; no schema migration is required for this update. Spoolman and Home Assistant remain read-only, and Bambuddy remains outside the quote/calculation workflow.
