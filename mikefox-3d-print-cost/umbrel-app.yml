id: mikefox-3d-print-cost
category: developer
name: 3D Print Cost
version: "0.7.0-dev.1"
tagline: Calculate fair 3D-print quotes and track order economics
description: >-
  A local calculator and order ledger for 3D-printing services, designed for Bambu Lab X2D workflows.


  Calculate a quote before printing using Bambu Studio time and filament usage, import sliced .3mf plate statistics, save order history, track two prices (minimum and recommended), and use a bounded adaptive equipment-payback model.


  Spoolman and Home Assistant integrations are read-only. This app never deducts filament, does not interfere with Bambuddy, and never calls Home Assistant write/service APIs.
releaseNotes: "Adds explicit SQLite migration tracking with automatic safety backups for future schema changes and expands financial regression tests for tax, OLX fees/caps, risk and adaptive payback fairness."
