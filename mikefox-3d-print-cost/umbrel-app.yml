id: mikefox-3d-print-cost
category: developer
name: 3D Print Cost
version: "0.5.0-dev.1"
tagline: Calculate fair 3D-print quotes and track order economics
description: >-
  A local calculator and order ledger for 3D-printing services, designed for Bambu Lab X2D workflows.


  Calculate a quote before printing using Bambu Studio time and filament usage, import sliced .3mf plate statistics, save order history, track two prices (minimum and recommended), and use a bounded adaptive equipment-payback model.


  Spoolman integration is read-only. This app never deducts filament and does not interfere with Bambuddy or Spoolman's own inventory workflow.
releaseNotes: "Adds validated dry-run JSON backup restore with explicit confirmation, transactional replace-all apply, and an automatic safety backup of the previous local database state."
