version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mikefox-3d-print-cost_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/mikefox303/3d-print-cost-umbrel:0.10.0-dev.1@sha256:e2288a7480576313beaeac82242528a5c4b60c7ffe24b3b2385d93d49be0cc0b
    restart: on-failure
    stop_grace_period: 30s
    init: true
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      PORT: 8080
    volumes:
      - ${APP_DATA_DIR}/data:/data
