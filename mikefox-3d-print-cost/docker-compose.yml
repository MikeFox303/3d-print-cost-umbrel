version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mikefox-3d-print-cost_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/mikefox303/3d-print-cost-umbrel:0.11.0-dev.1@sha256:898e165c8d66710959ebf883b23a946dd1ed86c22e5a27318b7781b251f827df
    restart: on-failure
    stop_grace_period: 30s
    init: true
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      PORT: 8080
    volumes:
      - ${APP_DATA_DIR}/data:/data
