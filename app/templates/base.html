<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>{% block title %}3D Print Cost{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/v02.css">
  <link rel="stylesheet" href="/static/v10.css">
  <link rel="stylesheet" href="/static/v11.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">3D</div><div><strong>Print Cost</strong><small>X2D / Umbrel</small></div></div>
    <nav>
      <div class="nav-group">
        <span class="nav-caption">Работа</span>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Обзор</a>
        <a href="/orders" class="{% if request.url.path.startswith('/orders') %}active{% endif %}">Заказы</a>
        <a href="/stats" class="{% if request.url.path.startswith('/stats') %}active{% endif %}">Статистика</a>
        <a href="/filaments" class="{% if request.url.path.startswith('/filaments') %}active{% endif %}">Материалы</a>
      </div>
      <div class="nav-group">
        <span class="nav-caption">Система</span>
        <a href="/settings" class="{% if request.url.path.startswith('/settings') %}active{% endif %}">Настройки</a>
        <a href="/home-assistant" class="{% if request.url.path.startswith('/home-assistant') %}active{% endif %}">Home Assistant</a>
        <a href="/system" class="{% if request.url.path.startswith('/system') %}active{% endif %}">Проверка системы</a>
        <a href="/backup/restore" class="{% if request.url.path.startswith('/backup') %}active{% endif %}">Backup / Restore</a>
      </div>
    </nav>
    <div class="side-note">v{{ version }}<br>Внешние интеграции — read only</div>
  </aside>
  <main>
    <header class="mobile-head"><div class="brand-mark">3D</div><strong>Print Cost</strong><a class="button small" href="/orders/new">+ Заказ</a></header>
    {% block content %}{% endblock %}
  </main>
</div>
<nav class="bottom-nav">
  <a href="/">Обзор</a><a href="/orders">Заказы</a><a class="new" href="/orders/new">＋</a><a href="/filaments">Материалы</a><a href="/settings">Настройки</a>
</nav>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
